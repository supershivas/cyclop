<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déterminisme — Cyclopéen</title>
<style>body { font: 14px/1.4 ui-monospace, monospace; margin: 24px; max-width: 80ch } pre { white-space: pre-wrap } button { font: inherit; padding: 6px 12px }</style>
</head>
<body>
<h1>Déterminisme</h1>
<p>La même graine et les mêmes ordres donnent-ils la même bataille ? Ouvrez cette page dans chaque navigateur (Chrome, Firefox) et comparez les empreintes. Page d'essai, hors du jeu.</p>
<p><button id="go">Lancer (120 s de jeu)</button></p>
<pre id="sortie"></pre>
<script type="module">
import { empreinteMaths, empreintesBataille } from './js/determinisme.js?v=0.59.1';
const q = new URLSearchParams(location.search), sortie = document.getElementById('sortie');
async function lancer() {
  const secondes = +(q.get('secondes') || 120), graine = +(q.get('graine') || 7);
  sortie.textContent = navigator.userAgent + '\n\nFonctions mathématiques :\n';
  const maths = empreinteMaths();
  sortie.textContent += Object.entries(maths).map(([k, v]) => `  ${k.padEnd(14)} ${v}`).join('\n') + '\n\nÉtat de la bataille (graine ' + graine + ') :\n';
  await new Promise(r => setTimeout(r, 30));
  const points = empreintesBataille({ graine, secondes });
  sortie.textContent += points.map(p => `  ${String(p[0]).padStart(4)} s  ${p[1]}  ${p[2]} hommes, ${p[3]} morts`).join('\n');
  window.__determinisme = { maths, points };
}
document.getElementById('go').onclick = lancer;
if (q.get('auto')) lancer();
</script>
</body>
</html>
